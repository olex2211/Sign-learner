services:
  db:
    image: postgres:15-alpine
    container_name: sign_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sign_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: sign_ml
    restart: always
    ports:
      - "8001:8001"

  ml-tools:
    build:
      context: ./ml
      dockerfile: Dockerfile
    profiles:
      - tools
    working_dir: /app
    volumes:
      - ./ml:/app
      - ./DataSet:/DataSet
      - ./DataSet_augmented:/DataSet_augmented
      - ./Zenodo_Dataset:/Zenodo_Dataset
    entrypoint: ["python"]
    command: ["--version"]

volumes:
  postgres_data:
