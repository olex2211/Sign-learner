services:
  db:
    image: postgres:15-alpine
    container_name: sign_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sign_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: sign_ml
    restart: always
    ports:
      - "8001:8001"

  ml-tools:
    build:
      context: ./ml
      dockerfile: Dockerfile.training
    profiles:
      - tools
    working_dir: /app
    volumes:
      - ./ml:/app
      - ./DataSet:/DataSet
      - ./DataSet_augmented:/DataSet_augmented
      - ./Zenodo_Dataset:/Zenodo_Dataset
    entrypoint: ["python"]
    command: ["--version"]

  frontend:
    image: node:22-alpine
    container_name: sign_frontend
    working_dir: /app
    ports:
      - "3000:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./mobile:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && rm -rf node_modules/.vite && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
